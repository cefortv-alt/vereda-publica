<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validar certificado — Vereda Pública · IPATE</title>
<meta name="robots" content="noindex">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap');
  :root { --navy:#0D1B3E; --orange:#F97316; --ok:#1c7c3a; --bad:#b3261e; --paper:#f6f7fb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'DM Sans',system-ui,sans-serif; background:var(--paper); color:#1f2a44; }
  header { background:var(--navy); color:#fff; padding:18px 20px; border-bottom:5px solid var(--orange); }
  header h1 { margin:0; font-family:'Space Grotesk',sans-serif; font-size:19px; letter-spacing:.02em; }
  header p { margin:4px 0 0; font-size:13px; opacity:.8; }
  main { max-width:560px; margin:0 auto; padding:22px 18px 40px; }
  label { font-weight:600; font-size:14px; }
  .row { display:flex; gap:8px; margin:8px 0 18px; }
  input { flex:1; padding:12px; font:inherit; border:1px solid #c5cbe0; border-radius:10px; text-transform:uppercase; }
  button { padding:12px 18px; font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--orange); color:#fff; cursor:pointer; }
  .card { background:#fff; border:1px solid #dfe3f0; border-radius:14px; padding:18px; }
  .ok { border-left:6px solid var(--ok); } .bad { border-left:6px solid var(--bad); }
  .status { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; margin:0 0 10px; }
  .ok .status { color:var(--ok); } .bad .status { color:var(--bad); }
  dl { margin:0; } dt { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#5b668a; margin-top:10px; } dd { margin:2px 0 0; font-weight:600; }
  .note { font-size:12.5px; color:#5b668a; margin-top:16px; line-height:1.45; }
</style>
</head>
<body>
<header><h1>Validação de certificado</h1><p>IPATE · Vereda Pública</p></header>
<main>
  <label for="code">Código de validação</label>
  <form class="row" id="f"><input id="code" placeholder="VP-XXXX-XXXX" autocomplete="off"><button type="submit">Validar</button></form>
  <div id="result" aria-live="polite"></div>
  <p class="note">Por privacidade, o CPF é exibido parcialmente oculto. Esta consulta confirma apenas se o certificado foi emitido pelo IPATE e quais dados constam nele.</p>
</main>
<script>
(function(){
  var URL_ = "https://rboezqvrxlfjrbrcmlgu.supabase.co";
  var KEY = "sb_publishable_xYjzqiavKQtkXXPA8WsUPQ_fGhacZZh";
  var out = document.getElementById("result"), input = document.getElementById("code");
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function show(ok, title, row){
    out.textContent = "";
    var c = el("div", "card " + (ok ? "ok" : "bad"));
    c.appendChild(el("p", "status", title));
    if (row) {
      var dl = el("dl");
      [["Nome", row.full_name], ["CPF", row.cpf_masked], ["Curso", row.course_title],
       ["Carga horária", row.hours + " horas"],
       ["Emitido em", new Date(row.issued_at).toLocaleDateString("pt-BR")]].forEach(function(p){
        dl.appendChild(el("dt", null, p[0])); dl.appendChild(el("dd", null, p[1]));
      });
      c.appendChild(dl);
    }
    out.appendChild(c);
  }
  function check(code){
    code = (code || "").trim();
    if (!code) return;
    out.textContent = "Consultando…";
    fetch(URL_ + "/rest/v1/rpc/verify_certificate", {
      method: "POST",
      headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_code: code })
    }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(rows){
        if (rows && rows.length) show(true, "✔ Certificado válido", rows[0]);
        else show(false, "Certificado não encontrado", null);
      }).catch(function(){ show(false, "Não foi possível consultar agora. Tente novamente em instantes.", null); });
  }
  document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); check(input.value); });
  var c = new URLSearchParams(location.search).get("c");
  if (c) { input.value = c; check(c); }
})();
</script>
</body>
</html>
